<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
{{- partial "head.html" . -}}
<body>
  <header id="topbar">
    <button id="sidebar-toggle" aria-label="Toggle menu">{{ partial "icon.html" "menu" }}</button>
    <div class="topbar-title">
      <a class="topbar-site" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
      {{- if and .IsPage (not .Date.IsZero) }}<span class="topbar-post">{{ .Title }}</span>{{ end }}
    </div>
    <div id="search" class="search" data-index="{{ "index.json" | relURL }}">
      <button id="search-toggle" class="search-toggle" aria-label="Search">{{ partial "icon.html" "search" }}</button>
      <div class="search-panel">
        <div class="search-box">
          {{ partial "icon.html" "search" }}
          <input id="search-input" class="search-input" type="search" placeholder="Search…" autocomplete="off" aria-label="Search posts">
        </div>
        <ul id="search-results" class="search-results" role="listbox"></ul>
      </div>
    </div>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
      {{ partial "icon.html" "sun" }}{{ partial "icon.html" "moon" }}{{ partial "icon.html" "monitor" }}
    </button>
  </header>

  {{- partial "sidebar.html" . -}}

  <div id="page-overlay"></div>

  <main id="main">
    <div id="content">
      {{- block "main" . }}{{- end }}
    </div>
    {{- partial "footer.html" . -}}
  </main>

  <script>
    (function () {
      var el = document.documentElement;
      var mql = window.matchMedia('(prefers-color-scheme: dark)');
      function apply(pref) {
        var applied = pref === 'auto' ? (mql.matches ? 'dark' : 'light') : pref;
        el.setAttribute('data-theme', applied);
        el.setAttribute('data-theme-pref', pref);
      }
      var toggle = document.getElementById('theme-toggle');
      if (toggle) {
        var order = ['light', 'dark', 'auto'];
        toggle.addEventListener('click', function () {
          var cur = el.getAttribute('data-theme-pref') || 'auto';
          var next = order[(order.indexOf(cur) + 1) % order.length];
          localStorage.setItem('theme', next);
          apply(next);
        });
      }
      // Track OS changes live while in auto mode.
      mql.addEventListener('change', function () {
        if ((el.getAttribute('data-theme-pref') || 'auto') === 'auto') apply('auto');
      });
      var sbToggle = document.getElementById('sidebar-toggle');
      var overlay = document.getElementById('page-overlay');
      function closeSidebar() { document.body.classList.remove('sidebar-open'); }
      if (sbToggle) sbToggle.addEventListener('click', function () {
        document.body.classList.toggle('sidebar-open');
      });
      if (overlay) overlay.addEventListener('click', closeSidebar);

      // Swap the mobile topbar to the post title once the heading scrolls
      // past the bar. Only runs on posts (both elements present).
      var postTitle = document.querySelector('.post-title');
      var topbarPost = document.querySelector('.topbar-post');
      if (postTitle && topbarPost && 'IntersectionObserver' in window) {
        var obs = new IntersectionObserver(function (entries) {
          document.body.classList.toggle('title-scrolled', !entries[0].isIntersecting);
        }, { rootMargin: '-52px 0px 0px 0px', threshold: 0 });
        obs.observe(postTitle);
      }

      // Live client-side search.
      var searchEl = document.getElementById('search');
      var input = document.getElementById('search-input');
      var results = document.getElementById('search-results');
      var searchBtn = document.getElementById('search-toggle');
      if (searchEl && input && results) {
        var indexUrl = searchEl.getAttribute('data-index');
        var data = null, loading = null, active = -1, current = [];

        function load() {
          if (data) return Promise.resolve(data);
          if (!loading) loading = fetch(indexUrl).then(function (r) { return r.json(); })
            .then(function (d) { data = d; return d; });
          return loading;
        }

        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        function close() {
          results.classList.remove('open');
          results.innerHTML = '';
          results.style.height = '';
          results.style.transition = '';
          results.style.overflow = '';
          clearTimeout(results._ht);
          active = -1; current = [];
        }

        // Slide the box height when the number of results changes.
        function slideHeight(startH) {
          if (startH == null || reduceMotion.matches) { results.style.height = ''; return; }
          results.style.transition = 'none';
          results.style.height = 'auto';
          var endH = results.offsetHeight;
          if (endH === startH) { results.style.transition = ''; results.style.height = ''; return; }
          results.style.overflow = 'hidden';
          results.style.height = startH + 'px';
          results.offsetHeight; // commit the start height
          results.style.transition = 'height 0.22s ease';
          results.style.height = endH + 'px';
          clearTimeout(results._ht);
          results._ht = setTimeout(function () {
            results.style.transition = '';
            results.style.overflow = '';
            results.style.height = ''; // release back to auto
          }, 240);
        }

        function render(matches, q) {
          var wasOpen = results.classList.contains('open');
          var startH = wasOpen ? results.offsetHeight : null;
          results.innerHTML = '';
          active = -1; current = matches;
          if (!q) { close(); return; }
          if (!matches.length) {
            var empty = document.createElement('li');
            empty.className = 'search-empty';
            empty.textContent = 'No results for “' + q + '”';
            results.appendChild(empty);
          } else {
            matches.slice(0, 8).forEach(function (m, i) {
              var li = document.createElement('li');
              var a = document.createElement('a');
              a.href = m.url;
              a.dataset.i = i;
              var t = document.createElement('span'); t.className = 'search-r-title'; t.textContent = m.title;
              var s = document.createElement('span'); s.className = 'search-r-summary'; s.textContent = m.summary;
              a.appendChild(t); a.appendChild(s);
              li.appendChild(a);
              results.appendChild(li);
            });
          }
          results.classList.add('open');
          if (wasOpen) slideHeight(startH);
        }

        function run() {
          var q = input.value.trim();
          if (!q) { close(); return; }
          var ql = q.toLowerCase();
          load().then(function (items) {
            var matches = items.filter(function (it) {
              return (it.title && it.title.toLowerCase().indexOf(ql) !== -1)
                || (it.tags && it.tags.toLowerCase().indexOf(ql) !== -1)
                || (it.content && it.content.toLowerCase().indexOf(ql) !== -1);
            });
            render(matches, q);
          });
        }

        function highlight() {
          var links = results.querySelectorAll('a');
          links.forEach(function (a, i) { a.classList.toggle('active', i === active); });
          if (active >= 0 && links[active]) links[active].scrollIntoView({ block: 'nearest' });
        }

        input.addEventListener('input', run);
        input.addEventListener('focus', load);
        input.addEventListener('keydown', function (e) {
          var links = results.querySelectorAll('a');
          if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active + 1, links.length - 1); highlight(); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); highlight(); }
          else if (e.key === 'Enter' && active >= 0 && links[active]) { e.preventDefault(); window.location = links[active].href; }
          else if (e.key === 'Escape') { close(); input.blur(); document.body.classList.remove('search-open'); }
        });

        if (searchBtn) searchBtn.addEventListener('click', function () {
          var open = document.body.classList.toggle('search-open');
          if (open) { load(); setTimeout(function () { input.focus(); }, 30); }
          else close();
        });

        document.addEventListener('click', function (e) {
          if (!e.target.closest('#search')) { close(); document.body.classList.remove('search-open'); }
        });
      }
    })();

    // Cross-page fade: fade the content out before same-site navigations;
    // CSS fades it back in on the next load.
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      document.addEventListener('click', function (e) {
        if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        var a = e.target.closest('a');
        if (!a || a.target === '_blank' || a.hasAttribute('download')) return;
        var href = a.getAttribute('href');
        if (!href || href.charAt(0) === '#') return;
        var url = new URL(a.href, location.href);
        if (url.origin !== location.origin) return;
        // In-page anchor on the current page: let the browser jump, no fade.
        if (url.pathname === location.pathname && url.hash) return;
        e.preventDefault();
        document.body.classList.add('is-leaving');
        setTimeout(function () { location.href = a.href; }, 180);
      });
      // Restored from the back/forward cache: clear the leaving state so the
      // page isn't stuck invisible.
      window.addEventListener('pageshow', function (e) {
        if (e.persisted) document.body.classList.remove('is-leaving');
      });
    })();
  </script>
</body>
</html>
